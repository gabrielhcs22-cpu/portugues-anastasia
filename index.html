<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Português para Anastasia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: тетрадь в линейку с полями; зелёные чернила и тёплый янтарь для ударений, как пометки учительницы */
:root{
  --paper:#f4f8f5; --card:#ffffff; --text:#18231d; --muted:#56665c;
  --ink:#16684a; --ink-soft:#e2f1e8; --red:#b25a07; --red-soft:#fbefdf;
  --line:#d8e5dc; --ok:#1f6fa8; --ok-soft:#e1eef8;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1712; --card:#14231b; --text:#e4efe8; --muted:#9db3a5;
  --ink:#7fd4ab; --ink-soft:#1c3427; --red:#f2a65a; --red-soft:#3a2a17;
  --line:#25392d; --ok:#7cbcf0; --ok-soft:#172a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1712; --card:#14231b; --text:#e4efe8; --muted:#9db3a5;
  --ink:#7fd4ab; --ink-soft:#1c3427; --red:#f2a65a; --red-soft:#3a2a17;
  --line:#25392d; --ok:#7cbcf0; --ok-soft:#172a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,30px);line-height:1.15;margin:0;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:10px 0;margin-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs .badge{background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:18px}

h2{font-family:var(--display);font-weight:500;font-size:20px;margin:28px 0 12px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-position:0 18px}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--red);opacity:.45}
.hero>*{position:relative;padding-left:40px}
.hero h3{font-family:var(--display);font-weight:500;font-size:20px;margin:4px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ink-soft);color:var(--ink)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--red-soft);color:var(--red)}

.phase{margin-top:22px}
.week{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.week summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.week summary::-webkit-details-marker{display:none}
.wnum{font-family:var(--display);font-size:13px;color:var(--red);min-width:30px}
.wbody{flex:1;min-width:0}
.wbody b{display:block}
.prog{height:4px;background:var(--ink-soft);border-radius:4px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.lessons{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--ink-soft)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--paper)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.lrow .lt{flex:1;min-width:0}
.lrow .ld{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.future{opacity:.8}
.future li{margin:2px 0}

.lesson-head{margin-top:8px}
.lesson-head h2{margin:6px 0 4px;font-size:24px}
.back{background:none;border:0;color:var(--ink);font-weight:600;padding:4px 0}
.step{margin-top:22px}
.step>.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.step>.sh .n{font-family:var(--display);color:var(--red);font-size:14px}
.step>.sh h3{margin:0;font-size:17px}
.step>.sh .t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.gram{border-left:3px solid var(--red);background:var(--card);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}

.phr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.phr .ru{font-size:21px;font-weight:600;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.st{color:var(--red);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-top:6px}
.phr .pr{font-size:15px;font-weight:500}
.phr .pr b,.pron b{color:var(--red);font-weight:700}
.phr .pt{font-size:15px}
.phr .nt{font-size:13px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.say{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.say:hover{border-color:var(--ink)}
.say svg{width:12px;height:12px;fill:currentColor}

.rev{display:grid;gap:8px}
.ritem{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}
.ritem .q{font-weight:600}
.ritem .src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ritem .a{margin-top:8px}

.dlg{display:grid;gap:8px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.bub.g{justify-self:end;background:var(--ink-soft);border-color:transparent}
.bub .who{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.bub .ru{font-weight:600;color:var(--ink)}
.bub .pt{font-size:14px;color:var(--muted)}
.bub .pt.hide{filter:blur(5px);cursor:pointer;user-select:none}

textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;resize:vertical}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 12px}
.rec{display:grid;gap:8px}
.rec audio{width:100%}
.mission{background:var(--red-soft);border-radius:var(--r);padding:14px 16px}
.mission b{color:var(--red)}

.close-list{display:grid;gap:8px}
.cl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.cl .q{flex:1;min-width:160px}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.seg button.on.y{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.seg button.on.n{background:var(--red);border-color:var(--red);color:#fff}

.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:18px;font-weight:600;color:var(--ink)}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opt.wrong{border-color:var(--red);background:var(--red-soft)}
.bar{height:6px;background:var(--ink-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;padding:28px 18px}
.fc .ru{font-size:28px;font-weight:600;color:var(--ink)}
.fc .pt{font-size:20px;font-weight:600}
.empty{text-align:center;padding:28px 18px}
.err{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.err p{margin:0;flex:1;min-width:0;white-space:pre-wrap}
.err small{display:block;color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;color:var(--red);font-size:13px;font-weight:600;padding:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.legend{font-size:13px;color:var(--muted)}
.pause{border:0;background:none;color:var(--ink);font-weight:600;font-size:13px;padding:0}
ol.guide li{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Português para Anastasia</h1>
      <p>Бразильский португальский с нуля, вместе с Габриэлем</p>
    </div>
    <div class="sync"><i></i><span>Прогресс сохраняется на этом устройстве</span></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const W = [
{n:1, title:"Звуки португальского", meta:"Научиться читать португальские слова и произносить звуки, которых нет в русском.",
 missions:["Oi, obrigada, sim, não, tchau, por favor, mãe, pão", "Rio, carro, caro, noite, tarde, dia, filho, casa"],
 dlg:[["Г","Oi! Tudo bem?","Привет! Как дела?"],["А","Tudo bem, obrigada. E você?","Всё хорошо, спасибо. А у тебя?"],["Г","Tudo ótimo!","Всё отлично!"],["А","Que bom!","Как здорово!"]],
 help:{t:"Помоги Габриэлю: звуки русского", x:"На этой неделе Габриэль учит Ы, Ш, Щ, Ж и Ч. Попроси его сказать мы, ты, щи, журнал и чай и поправь его. А он поправит твои носовые звуки в não и mãe."},
 L:[
  {t:"Первые слова", g:"Ударный слог в произношении написан заглавными буквами. Женщина говорит obrigada, мужчина obrigado: слово меняется по роду того, кто благодарит.",
   p:[["Oi!","ой","Привет!"],["Sim","СИН","Да","Конечная m делает гласную носовой: «н» почти не слышно."],["Não","НАУН","Нет","Носовой звук: воздух идёт через нос."],["Obrigada!","о-бри-ГА-да","Спасибо! (говорит женщина)","Габриэль говорит obrigado."],["Tchau!","ЧАУ","Пока!"],["Por favor","пур фа-ВОР","Пожалуйста (просьба)"]],
   task:"Не подглядывая, напиши по-португальски: привет, да, нет, спасибо и пока."},
  {t:"Носовые гласные", g:"Тильда (~) и буквы m или n в конце слога делают гласную носовой: часть воздуха идёт через нос, а сама «н» почти не звучит. В русском таких звуков нет, поэтому это главный звук недели.",
   p:[["mãe","МАЙН","мама"],["pão","ПАУН","хлеб"],["bem","БЕЙН","хорошо"],["um","УН","один"],["irmão","ир-МАУН","брат"],["amanhã","а-ма-НЬЯН","завтра"]],
   task:"Запиши произношение слов mãe, pão и bem и скажи их вслух 5 раз."},
  {t:"Буква R", g:"R в начале слова и двойная RR звучат как русское Х: Rio звучит «Хиу». Одна R между гласными звучит как короткое русское Р. Поэтому carro (машина) и caro (дорогой) это разные слова.",
   p:[["Rio","ХИ-у","Рио"],["carro","КА-ху","машина"],["caro","КА-ру","дорогой"],["rua","ХУ-а","улица"],["amor","а-МОР","любовь, любимый","Конечная R мягкая, иногда почти не слышна."],["porta","ПОР-та","дверь"]],
   task:"Скажи вслух пары carro / caro и попроси Габриэля проверить."},
  {t:"TE, DE и конечные гласные", g:"В бразильском варианте T и D перед звуком «и» смягчаются: te и ti звучат «чи», de и di звучат «джи». Безударная o в конце слова звучит как «у», безударная e как «и».",
   p:[["noite","НОЙ-чи","ночь, вечер"],["tarde","ТАР-джи","день (после обеда)"],["dia","ДЖИ-а","день"],["leite","ЛЕЙ-чи","молоко"],["obrigado","о-бри-ГА-ду","спасибо (говорит мужчина)"],["gente","ЖЕН-чи","люди"]],
   task:"Найди в этом уроке все слова, где T или D звучат как «ч» или «дж»."},
  {t:"LH, NH, Ç, S и X", g:"LH звучит как «ль» перед гласной, NH как «нь». Ç всегда «с». Одна S между гласными звучит как «з»: casa звучит «каза». X часто звучит как «ш».",
   p:[["filho","ФИ-лью","сын"],["mulher","му-ЛЬЕР","женщина"],["banho","БА-нью","душ, ванна"],["maçã","ма-САН","яблоко"],["casa","КА-за","дом"],["caixa","КАЙ-ша","коробка"]],
   task:"Прочитай вслух все 30 слов недели в правильном порядке."},
  {t:"Повторение недели", kind:"rev", scope:"week", task:"Прочитай вслух все слова недели и запиши аудиозадание 2."}
 ]},
{n:2, title:"Знакомство и «как прошёл день»", meta:"Начать разговор, представиться и задать вопрос в ответ.",
 missions:["Представься за 30 секунд: имя, страна, город", "Спроси Габриэля, как прошёл его день, и отреагируй на ответ"],
 dlg:[["А","Oi! Meu nome é Anastasia. Eu sou da Rússia.","Привет! Меня зовут Анастасия. Я из России."],["Г","Prazer! Eu sou o Gabriel.","Приятно познакомиться! Я Габриэль."],["А","Como foi o seu dia?","Как прошёл твой день?"],["Г","Foi bom, mas estou cansado. E o seu?","Хорошо, но я устал. А твой?"],["А","Foi ótimo!","Отлично!"]],
 help:{t:"Помоги Габриэлю: знакомство", x:"Габриэль учит Меня зовут..., Я из Бразилии и Как прошёл твой день?. Задай ему эти вопросы по-русски и поправь ударения."},
 L:[
  {t:"Представиться", g:"Глагол «быть» в португальском обязателен: eu sou = я есть. Da Rússia = из России (de + a = da).",
   p:[["Meu nome é Anastasia.","МЕУ НО-ми э а-нас-та-ЗИ-а","Меня зовут Анастасия."],["Eu sou da Rússia.","эу СОУ да ХУ-сья","Я из России."],["Eu moro em...","эу МО-ру эйн","Я живу в..."],["Prazer!","пра-ЗЕР","Приятно познакомиться!"]],
   task:"Напиши своё знакомство из трёх фраз."},
  {t:"Как прошёл день", g:"Tudo bem? значит «Как дела?», а отвечают Tudo! или Tudo bem, никогда не «Sim». E você? задаёт вопрос в ответ.",
   p:[["Tudo bem?","ТУ-ду БЕЙН","Как дела?"],["Tudo, e você?","ТУ-ду, и во-СЕ","Всё хорошо, а у тебя?"],["Como foi o seu dia?","КО-му ФОЙ у СЕУ ДЖИ-а","Как прошёл твой день?"],["Foi ótimo!","фой О-чи-му","Отлично!"]],
   task:"Напиши Габриэлю: Oi! Como foi o seu dia?"},
  {t:"Как я себя чувствую", g:"Прилагательное меняется по роду: ты говоришь cansada, Габриэль говорит cansado. Estou = «я (сейчас)», этот глагол нужен всегда.",
   p:[["Estou cansada.","ис-ТОУ кан-СА-да","Я устала."],["Mais ou menos.","МАЙЗ оу МЕ-нус","Так себе."],["Estou ocupada.","ис-ТОУ о-ку-ПА-да","Я занята."],["Foi um dia difícil.","фой ун ДЖИ-а джи-ФИ-сиу","Был трудный день.","Конечная L звучит почти как «у»."]],
   task:"Напиши двумя фразами, как прошёл твой день сегодня."},
  {t:"Реакции", g:"Короткие реакции поддерживают разговор и показывают, что ты поняла.",
   p:[["Eu também.","эу там-БЕЙН","Я тоже."],["Sério?","СЭ-рьу","Серьёзно?"],["Entendi.","ин-тен-ДЖИ","Понятно."],["Que legal!","ки ле-ГАУ","Как здорово!"]],
   task:"Ответь на «Hoje eu descansei» (сегодня я отдыхал) реакцией и вопросом."},
  {t:"Понимать его ответы", g:"Габриэль может ответить по-разному. Научись узнавать эти ответы раньше, чем начнёшь их использовать.",

  {t:"Глаголы на -er и -ir", g:"Assistir (смотреть фильм, сериал): eu assisto, você assiste. Ler (читать): eu leio, você lê. Escrever (писать): eu escrevo, você escreve.",

  {t:"Части дня", g:"De manhã (утром), à tarde (днём), à noite (вечером), agora (сейчас). Estou + -ndo = «я сейчас делаю»: estou trabalhando.",

 ]},

  {t:"Любимое", g:"Род: o filme favorito (м. р.), a música favorita (ж. р.). Seu и sua = твой и твоя.",

   task:"Спроси Габриэля о двух любимых вещах и расскажи о своих."},
  {t:"Согласиться и не согласиться", g:"Отрицание: não ставится перед глаголом, как русское «не»: não gosto.",
   p:[["Eu também.","эу там-БЕЙН","Я тоже."],["Eu não.","эу НАУН","А я нет."],["Que massa!","ки МА-са","Класс! (сленг)"],["Não gosto muito.","НАУН ГОС-ту МУЙН-ту","Мне не очень нравится."]],
   task:"Ответь на: Eu gosto de calor. Eu não gosto de frio."},
  {t:"Повторение недели", kind:"rev", scope:"week", task:"Разговор на 3 минуты о вкусах, с вопросами и реакциями."}
 ]},
{n:5, title:"Прошедшее время", meta:"Рассказать, что ты делала, и спросить, что делал он.",
 missions:["5 фраз о вчерашнем дне", "Расскажи о своих выходных за 1 минуту"],

 L:[

   task:"Напиши, где ты была вчера, сегодня утром и в выходные."},
  {t:"Прошедшее время", g:"Глаголы на -ar: eu trabalhei, você trabalhou. На -er и -ir: eu assisti, você assistiu. Fazer неправильный: eu fiz, você fez. И никакого рода!",
   p:[["O que você fez ontem?","у ки во-СЕ ФЕС ОН-тейн","Что ты делал вчера?"],["Eu trabalhei o dia todo.","эу тра-ба-ЛЬЕЙ у ДЖИ-а ТО-ду","Я работала весь день."],["Eu assisti um filme.","эу а-сис-ЧИ ун ФИУ-ми","Я посмотрела фильм."],["Eu fiz o jantar.","эу ФИЗ у жан-ТАР","Я приготовила ужин."]],
   task:"Расскажи о трёх вещах, которые ты делала вчера."},
  {t:"Выходные", g:"Fim de semana = выходные (буквально «конец недели»), в единственном числе: o fim de semana foi bom.",

   task:"Спроси Габриэля про выходные и расскажи о своих."},
  {t:"Ir в прошедшем", g:"Ir (идти, ехать) в прошедшем: eu fui, você foi. Foi значит также «был, была» (от ser): o dia foi bom.",

   task:"Расскажи, куда ты ходила на этой неделе."},
  {t:"Вопросы ему", g:"Вопрос часто отличается от утверждения только интонацией: Você dormiu bem? Голос поднимается в конце.",

   task:"Напиши Габриэлю «доброе утро» с вопросом в прошедшем времени: Bom dia! Você dormiu bem?"},
  {t:"Повторение недели", kind:"rev", scope:"week", task:"Расскажи о своих выходных за 1 минуту и запиши аудиозадание 2."}
 ]},
{n:6, title:"Чувства и нежность", meta:"Выражать нежность, тоску и поддержку естественно, без пафоса.",
 missions:["5 фраз о чувствах", "Голосовое сообщение Габриэлю на 30 секунд"],
 dlg:[["Г","Estou triste hoje.","Мне сегодня грустно."],["А","O que aconteceu?","Что случилось?"],["Г","Foi um dia difícil no trabalho.","Был трудный день на работе."],["А","Não se preocupa. Vai ficar tudo bem. Estou aqui com você.","Не переживай. Всё будет хорошо. Я рядом."]],

 L:[
  {t:"Saudade", g:"Saudade: знаменитое слово, которое не переводится одним словом. Это тоска по тому, кого любишь и кого нет рядом. Estou com saudade de você = я скучаю по тебе.",
   p:[["Estou com saudade.","ис-ТОУ кун сау-ДА-джи","Я скучаю."],["Sinto sua falta.","СИН-ту СУ-а ФАУ-та","Мне тебя не хватает."],["Penso em você.","ПЕН-су эйн во-СЕ","Я думаю о тебе."],["Sonhei com você.","су-НЬЕЙ кун во-СЕ","Ты мне снился."]],
   task:"Напиши Габриэлю короткое сообщение о том, что скучаешь."},
  {t:"Эмоции", g:"Чувства: estou + прилагательное. Не путай: entediada (мне скучно) и saudade (скучаю по кому-то).",
   p:[["Estou triste.","ис-ТОУ ТРИС-чи","Мне грустно."],["Estou feliz.","ис-ТОУ фе-ЛИС","Я счастлива."],["Estou entediada.","ис-ТОУ ин-те-джи-А-да","Мне скучно."],["Estou bem.","ис-ТОУ БЕЙН","Я в порядке."]],
   task:"Напиши, как ты себя чувствуешь сегодня и почему."},
  {t:"Как он себя чувствует", g:"Se sentir (чувствовать себя): eu me sinto, você se sente. Estou me sentindo = я сейчас чувствую себя.",
   p:[["Como você está se sentindo?","КО-му во-СЕ ис-ТА си сен-ЧИН-ду","Как ты себя чувствуешь?"],["Não estou me sentindo bem.","НАУН ис-ТОУ ми сен-ЧИН-ду БЕЙН","Я плохо себя чувствую."],["O que aconteceu?","у ки а-кон-те-СЕУ","Что случилось?"],["Estou preocupada com você.","ис-ТОУ прэ-у-ку-ПА-да кун во-СЕ","Я волнуюсь за тебя."]],
   task:"Представь, что он написал: Não estou me sentindo bem. Напиши ответ."},
  {t:"Поддержка", g:"Não se preocupa: разговорная форма, в письменной речи пишут não se preocupe. Бразильцы часто поддерживают словами força (держись) и parabéns (молодец).",
   p:[["Vai ficar tudo bem.","ВАЙ фи-КАР ТУ-ду БЕЙН","Всё будет хорошо."],["Estou aqui com você.","ис-ТОУ а-КИ кун во-СЕ","Я рядом."],["Não se preocupa.","НАУН си прэ-у-КУ-па","Не переживай."],["Parabéns!","па-ра-БЕЙНС","Поздравляю! Молодец!"]],
   task:"Напиши сообщение поддержки на трудный для него день."},
  {t:"Нежность", g:"Ласковые слова в Бразилии: amor (любимый, любимая), querido (дорогой), lindo (красавчик). Их говорят часто и легко.",
   p:[["Eu gosto de você.","эу ГОС-ту джи во-СЕ","Ты мне нравишься."],["É bom estar com você.","э БОН ис-ТАР кун во-СЕ","Мне хорошо с тобой."],["Boa noite, dorme bem.","БО-а НОЙ-чи, ДОР-ми БЕЙН","Спокойной ночи, спи хорошо."],["Bons sonhos.","БОНС СО-ньюс","Сладких снов."]],
   task:"Напиши естественное сообщение на ночь."},
  {t:"Повторение недели", kind:"rev", scope:"week", task:"Запиши голосовое сообщение из аудиозадания 2."}
 ]},
{n:7, title:"Числа, время и звонки", meta:"Договориться о видеозвонке со временем и решить проблемы со связью.",
 missions:["Числа от 1 до 20", "Договорись о звонке: день и время"],
 dlg:[["А","Vamos nos falar?","Созвонимся?"],["Г","Vamos! Quando é bom para você?","Давай! Когда тебе удобно?"],["А","Que horas são aí?","Сколько у тебя сейчас времени?"],["Г","Aqui são três da tarde.","У меня три часа дня."],["А","Eu te ligo daqui a uma hora.","Я позвоню тебе через час."]],
 help:{t:"Помоги Габриэлю: числа", x:"Габриэль учит числа от 1 до 24 и фразу меня слышно?. Продиктуй ему по-русски время звонка и проверь, понял ли он."},
 L:[

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const pron = s => esc(s).replace(/([А-ЯЁ]{2,})|(^|[^а-яёА-ЯЁ])([А-ЯЁ])(?=$|[^а-яёА-ЯЁ])/g, (m,multi,pre,single) => multi ? "<b>"+multi+"</b>" : pre+"<b>"+single+"</b>");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const dshort = s => { const d=parse(s); return d.getDate()+" "+MON[d.getMonth()]; };
const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';
const plural = (n,a,b,c) => { const m10=n%10, m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); };

const PH={}, LESSONS=[];
W.forEach(w=>{ w.L.forEach((l,i)=>{ const id="w"+w.n+"l"+(i+1), k=LESSONS.length; const L=Object.assign({},l,{id,k,w,i:i+1,pids:[]});
  (l.p||[]).forEach((p,j)=>{ const pid=id+"p"+j; PH[pid]={id:pid,pt:p[0],pr:p[1],ru:p[2],nt:p[3]||"",k,src:"Неделя "+w.n}; L.pids.push(pid); });
  LESSONS.push(L); }); });
const byId=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const weekPids = w => LESSONS.filter(l=>l.w===w).flatMap(l=>l.pids);

const KEY="pt-anastasia-v1";
const blank=()=>({done:{},cards:{},errors:[],drafts:{},quiz:{},days:[],recall:{}});
let S=blank();
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(blank(), JSON.parse(raw)); }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function markDay(){ const t=today(); if(!S.days.includes(t)){ S.days.push(t); if(S.days.length>400) S.days=S.days.slice(-400); } }
function streak(){ const set=new Set(S.days); let n=0, d=today(); if(!set.has(d)) d=addDays(d,-1);
  for(let g=0; g<500; g++){ if(set.has(d)){ n++; d=addDays(d,-1); } else if(parse(d).getDay()===0){ d=addDays(d,-1); } else break; } return n; }

const IV=[1,3,7,14,30,60];
const due = () => Object.entries(S.cards).filter(([id,c])=>PH[id] && c.d<=today()).map(([id])=>id);
function grade(id, ok){ const c=S.cards[id]||{b:0,d:today()}; if(ok){ c.b=Math.min(c.b+1,IV.length-1); c.d=addDays(today(),IV[c.b]); } else { c.b=0; c.d=addDays(today(),1); } S.cards[id]=c; }

let voice=null, checked=false;
function pickVoice(){ if(!("speechSynthesis" in window)) return; const v=speechSynthesis.getVoices(); voice=v.find(x=>/^pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null; checked=v.length>0; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(t, slow){
  if(!("speechSynthesis" in window)){ toast("Этот браузер не умеет читать текст вслух."); return; }
  pickVoice(); const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,"")); u.lang="pt-BR"; if(voice) u.voice=voice; u.rate=slow?0.6:0.92;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  if(checked && !voice) toast("На устройстве нет португальского голоса. Добавь его в настройках языка и озвучивания текста.");
}
let tT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>t.hidden=true,3500); }
const sayBtns = s => `<button class="say" data-say="${esc(s)}">${PLAY} Слушать</button><button class="say" data-say="${esc(s)}" data-slow="1">${PLAY} Медленно</button>`;

let view="hoje", cur=null;
const TABS=[["hoje","Сегодня"],["curso","Курс"],["revisar","Карточки"],["erros","Дневник ошибок"],["guia","Как это работает"]];
function renderTabs(){ const n=due().length; $("#tabs").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" ${view===k||(view==="aula"&&k==="curso")?'aria-current="page"':''}>${t}${k==="revisar"&&n?` <span class="badge">${n}</span>`:''}</button>`).join(""); }
function go(v,id){ view=v; cur=id||null; render(); window.scrollTo({top:0}); }
function render(){ renderTabs(); $("#view").innerHTML=({hoje:vHoje,curso:vCurso,aula:vAula,revisar:vRevisar,erros:vErros,guia:vGuia})[view](); after(); }

const nextLesson = () => LESSONS.find(l=>!S.done[l.id])||null;
function vHoje(){
  const nx=nextLesson(), dn=due().length, deck=Object.keys(S.cards).length, doneN=Object.keys(S.done).filter(k=>byId[k]).length, st=streak();
  const hero = nx ? `<section class="hero"><div class="eyebrow">${nx.k===0?"Начни отсюда":"Следующий урок"} · Неделя ${nx.w.n}, урок ${nx.i}</div><h3>${esc(nx.t)}</h3><p class="muted small" style="margin:0 0 12px">${esc(nx.w.title)}</p><div class="row"><button class="btn" data-open="${nx.id}">Открыть урок</button>${dn?`<button class="btn ghost" data-tab="revisar">Повторить ${dn} ${plural(dn,"карточку","карточки","карточек")}</button>`:""}</div><p class="small muted" style="margin:12px 0 0">Переходи к следующему уроку, только если в конце урока почти все фразы отмечены как «Вспомнила».</p></section>`
    : `<section class="hero"><div class="eyebrow">Всё пройдено</div><h3>Ты прошла весь курс первого уровня!</h3><p class="muted">Попроси Габриэля о следующем модуле.</p></section>`;
  return `${hero}<div class="grid" style="margin-top:12px">
   <div class="stat"><b>${doneN}/${LESSONS.length}</b><span>уроков пройдено</span></div>
   <div class="stat"><b>${deck}</b><span>фраз в колоде</span></div>
   <div class="stat"><b>${dn}</b><span>карточек на сегодня</span></div>
   <div class="stat"><b>${st}</b><span>${plural(st,"день","дня","дней")} подряд</span></div></div>
  <h2>Каждый урок по шагам</h2>
  <div class="card stack small">
   <div><b>Сначала</b> · карточки на сегодня</div>
   <div><b>5 мин</b> · повторение в начале, не подглядывая в ответ</div>
   <div><b>10 мин</b> · новые фразы: слушай и повторяй</div>
   <div><b>5 мин</b> · грамматика на практике</div>
   <div><b>10 мин</b> · диалог и аудирование</div>
   <div><b>5 мин</b> · речь: запиши себя и сравни</div>
   <div><b>5 мин</b> · письмо: настоящее сообщение Габриэлю</div>
   <div><b>3 мин</b> · повторение в конце</div></div>`;
}
function vCurso(){
  return `<p class="legend">В произношении ударный слог выделен <b style="color:var(--red)">ЗАГЛАВНЫМИ</b> буквами. Уроки идут по порядку, но открыть можно любой.</p>
  <section class="phase"><div class="eyebrow">Уровень A1</div><h2 style="margin-top:4px">Первые разговоры</h2>` +

  if(d.mode){ RV.mode=d.mode; RV.show=false; render(); return; }
  if(d.adderr!=null){ const t=$("#err-new"), v=t.value.trim(); if(!v) return; S.errors.push({id:"e"+Date.now(),t:v.slice(0,600),d:today()}); if(S.errors.length>300) S.errors=S.errors.slice(-300); persist(); render(); toast("Исправление добавлено"); return; }
  if(d.delerr){ S.errors=S.errors.filter(x=>x.id!==d.delerr); persist(); render(); return; }
});
render();
})();

</script>
</body>
