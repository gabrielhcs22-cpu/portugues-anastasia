<!doctype html><html lang="ru" translate="no"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Português para Anastasia</title>
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0D1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

</head><body>
<style>
/* Layout: painel tático escuro. Grafite profundo, azul-aço para pronúncia e informação, latão para ação e destaque; uma ação principal por tela, navegação na zona do polegar */
:root{
  color-scheme:dark;
  --bg:#0D1117; --surface:#151B23; --sand:#2A3340; --line:#232B36;
  --blue:#3F6EA8; --blue-soft:#16212F; --blue-ink:#8DB4E8;
  --lav:#5A4A2C; --lav-soft:#231F17; --lav-ink:#D2AA62;
  --rose:#6B5426; --rose-soft:#2A2315; --rose-ink:#F2B24C;
  --mint:#2E6B50; --mint-soft:#13261E; --mint-ink:#6CC59A;
  --text:#E6E9EE; --muted:#9AA4B2;
  --surface-2:var(--blue-soft); --cobalt:var(--blue-ink); --cobalt-2:var(--blue-ink); --cobalt-soft:var(--blue-soft);
  --ruby:var(--rose-ink); --ruby-soft:var(--rose-soft); --ipe:var(--rose-ink); --ipe-soft:var(--rose-soft); --ok:var(--mint-ink); --ok-soft:var(--mint-soft);
  --brass:#D9A441; --on-brass:#11151B;
  --display:"Oswald","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.65);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 22px 46px -16px rgba(0,0,0,.75);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:3px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:18px calc(118px + env(safe-area-inset-bottom,0px))}
#view{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* topo */
.top{display:flex;align-items:center;gap:12px;padding:2px 0 22px}
.mark{width:36px;height:36px;flex:none;color:var(--lav-ink);background:var(--lav-soft);border-radius:12px;padding:6px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.01em;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--muted)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--sand);flex:none;box-shadow:0 0 0 4px var(--bg)}
.sync.on{background:var(--mint-ink)}

/* navegação inferior: zona do polegar, alvos de 56px */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,17,23,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px 4px}
.nav button{border:0;background:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative;border-radius:14px;transition:color .2s var(--ease)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;padding:3px 14px;box-sizing:content-box;border-radius:999px;transition:background .25s var(--ease)}
.nav button[aria-current="page"]{color:var(--text);font-weight:600}
.nav button[aria-current="page"] svg{background:var(--lav-soft);color:var(--lav-ink)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--rose-ink);color:var(--on-brass);font-family:var(--mono);font-size:10px;line-height:18px;padding:0 5px}

/* tipografia: escala 12 / 14 / 16 / 20 / 28 / 40 */
h1,h2,h3{margin:0;text-wrap:balance}
.h-display{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.1}
h2.sec{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:40px 0 14px;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--lav-ink)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.55}
.tiny{font-size:12px}
.ru{font-family:var(--body);font-weight:600;color:var(--text);letter-spacing:-.005em}
.st{color:var(--rose-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--rose-ink)}
.pron{color:var(--blue-ink);font-weight:500}
.pron b{font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#1B2636 0%,#141B25 58%,#211C13 100%);border:1px solid var(--line);color:var(--text);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow)}
.hero .orn{position:absolute;right:-30px;top:-30px;width:210px;height:210px;opacity:.22;color:var(--blue-ink);pointer-events:none}
.hero .eyebrow{color:var(--lav-ink)}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,9vw,44px);line-height:1.05;margin:10px 0 4px;position:relative;letter-spacing:-.015em}
.hero p{position:relative;margin:4px 0 0;color:var(--muted)}
.hero .pron{color:var(--blue-ink)}
.hero .st{color:var(--rose-ink);text-decoration-color:var(--rose-ink)}
.hero .tiny{color:var(--lav-ink)}

/* botões: grafite = ação principal, pastel = secundária */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px solid var(--brass);background:var(--brass);color:var(--on-brass);padding:12px 20px;border-radius:14px;font-weight:600;font-size:15px;line-height:1.2;transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s}
.btn:hover{box-shadow:var(--shadow-lift)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--sand)}
.btn.ghost:hover{border-color:var(--text)}
.btn.ok{background:var(--mint-ink);border-color:var(--mint-ink);color:var(--on-brass)}
.btn.ruby{background:transparent;border-color:var(--rose-ink);color:var(--rose-ink)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
.btn svg{width:14px;height:14px;fill:currentColor}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--blue-ink);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;transition:background .2s var(--ease),border-color .2s,transform .15s var(--ease)}
.play svg{width:11px;height:11px;fill:currentColor}
.play.icon{width:42px;height:42px;padding:0;flex:none;border-radius:50%;background:var(--blue-soft);border-color:transparent}
.play.icon[data-slow]{background:var(--surface);border-color:var(--line)}
.play.icon svg{width:13px;height:13px}
.play:hover{border-color:var(--blue)}
.play:active{transform:scale(.94)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink)}
.chip.ipe{background:var(--rose-soft);color:var(--rose-ink)}
.chip.ok{background:var(--mint-soft);color:var(--mint-ink)}
.chip.ruby{background:var(--rose);color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.toggle::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;flex:none}
.toggle[aria-pressed="true"]{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.toggle[aria-pressed="true"]::before{background:var(--blue-ink);border-color:var(--blue-ink);box-shadow:inset 0 0 0 2px var(--blue-soft)}
.eyebrow,.gtitle{font-family:var(--mono);letter-spacing:.08em}
.uhead h1,.hero h1,h2.sec,.stepname h2{text-transform:none}

/* números em fonte mono */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:24px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat:nth-child(1){border-top:3px solid var(--blue)}
.stat:nth-child(2){border-top:3px solid var(--lav)}
.stat:nth-child(3){border-top:3px solid var(--rose)}

/* unidades */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ucard{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.ucard .num{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.ucard .rt{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.1;color:var(--text)}
.ucard .pt{font-weight:600}
.ucard .goal{font-size:13px;color:var(--muted);line-height:1.5}
.ucard.cur{border:2px solid var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--surface) 55%)}
.ucard .bar{margin-top:8px}
.lock{opacity:.85}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue-ink);border-radius:6px;transition:width .5s var(--ease)}

/* unidade */
.uhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.uhead h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,10vw,52px);line-height:1.02;color:var(--text);letter-spacing:-.015em}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;font-size:14px;min-height:40px}
.back:hover{color:var(--text)}
.steps{display:flex;gap:6px;margin:12px 0 8px}
.steps button{flex:1;height:8px;border-radius:8px;border:0;background:var(--sand);padding:0;transition:background .3s var(--ease)}
.steps button.on{background:var(--blue)}
.steps button.cur{background:var(--rose-ink)}
.stepname{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 14px}
.stepname h2{font-family:var(--display);font-weight:500;font-size:32px;letter-spacing:-.01em}
.stepname .small{font-family:var(--mono);font-size:13px}
.togs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.scene{background:var(--lav-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.scene p{margin:0}
.sgoal{display:flex;gap:8px;margin-top:12px;font-size:14px;font-weight:600;color:var(--lav-ink)}

.dlg{display:flex;flex-direction:column;gap:12px}
.bub{max-width:92%;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.bub.g{align-self:flex-end;background:var(--blue-soft);border-color:transparent;border-radius:20px 20px 6px 20px;box-shadow:none}
.bub .who{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bub .ru{font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.bub .pron{font-size:14px;margin-top:3px}
.bub .tr{font-size:14px;color:var(--muted);margin-top:3px}
.blur{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .3s var(--ease)}
.bub>div{flex:1;min-width:0}

.chunk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.chunk>div{flex:1;min-width:0}
.chunk .ru{font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.chunk .pron{font-size:15px;margin-top:2px}
.chunk .pt{font-size:15px;margin-top:4px}
.chunk .nt{font-size:13px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--lav)}
.chunk .acts{display:flex;flex-direction:column;gap:8px}
.corr{margin-top:10px;font-size:13px;border-radius:12px;padding:8px 12px}
.corr.ok{background:var(--mint-soft);color:var(--mint-ink)}
.corr.ko{background:var(--rose-soft);color:var(--text)}
.corr.ko b{color:var(--rose-ink)}

/* correção de pronúncia */
.mic{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--lav-soft);color:var(--brass);display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
.mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.mic[aria-expanded="true"]{background:var(--brass);color:var(--on-brass)}
.mic:active{transform:scale(.94)}
.speak .lbl b.rectxt{color:var(--rose-ink)}
.mic.rec{background:var(--rose-ink);color:var(--on-brass);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,178,76,.55)}100%{box-shadow:0 0 0 14px rgba(242,178,76,0)}}
.pres .sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mic.lg{width:64px;height:64px;background:var(--brass);color:var(--on-brass);box-shadow:var(--shadow)}
.mic.lg svg{width:26px;height:26px}
.fcmic{display:flex;flex-direction:column;align-items:center;gap:6px}
.errs{display:flex;flex-direction:column;gap:8px}
.errs .ttl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rose-ink);font-family:var(--mono)}
.err{display:flex;gap:12px;align-items:center;background:var(--rose-soft);border-radius:12px;padding:10px 12px}
.err>div{flex:1;min-width:0}
.err .ru{font-size:18px}
.err .why{font-size:13px;line-height:1.5;margin-top:2px}
.err .acts2{display:flex;gap:6px;flex:none}
.pw{border:0;font:inherit;cursor:pointer}
.letter .row{margin-top:8px}
.letter.wide{grid-column:1/-1}
.bub .acts{display:flex;flex-direction:column;gap:8px;flex:none}
.memo .row{margin-top:2px}
.ex .acts{display:flex;gap:8px;flex:none;align-self:flex-start}
.rc{cursor:pointer}
.rc .a .row{margin-top:8px}
.chatbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.chatbox .dlg{gap:10px}
.chatbox .bub{max-width:96%}
.typing{color:var(--muted);font-size:14px}
.chatctl{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.chatin{display:flex;gap:8px;width:100%}
.chatin input{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--sand);background:var(--bg);border-radius:12px;padding:10px 14px;font-size:16px}
.chatin input:focus{outline:none;border-color:var(--brass)}
.chaterr{background:var(--rose-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.fb{display:flex;flex-direction:column;gap:10px}
.coach{display:flex;flex-direction:column;gap:12px}
.coach .chunk{padding:14px}
.coach .chunk .ru{font-size:19px}
.coach .sg{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.coach .sg:first-of-type{border-top:0}
.chip.som{background:var(--lav-soft);color:var(--lav-ink);margin-top:4px}
.fb ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.free textarea{width:100%;min-height:84px;resize:vertical;border:1.5px solid var(--sand);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.5}
.free textarea:focus{outline:none;border-color:var(--brass)}
.freelist .ex .ru{font-size:17px}
.free .chunk.cur{flex-direction:column;gap:10px}
.free .chunk.cur>div{width:100%}
.free .chunk.cur .acts{flex-direction:row;align-items:center}
.freelist .ex{flex-wrap:wrap}
.freelist .ex>div:first-child{flex:1 1 220px}
.freelist .ex .acts{align-items:center}
.freelist .del{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;min-height:40px;padding:0 6px}
.freelist .del:hover{color:var(--rose-ink)}
.tip.ai ul{margin:6px 0 0;padding-left:18px}
.shlist{display:flex;flex-direction:column;gap:8px}
.shline{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);transition:border-color .2s,background .2s}
.shline .who,.bub.mini .who{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.shline .ru{font-size:17px;overflow-wrap:anywhere}
.shline.on{border-color:var(--brass);background:var(--lav-soft)}
.drturn{border:1.5px solid var(--brass);border-radius:var(--r);padding:16px;background:var(--lav-soft);display:flex;flex-direction:column;gap:10px}
.drturn .ptq{font-family:var(--display);font-size:24px;line-height:1.2}
.drturn .ru{font-size:19px}
.drturn .fcmic{align-items:flex-start}
.bub.mini{padding:10px 12px;box-shadow:none;max-width:96%}
.bub.mini .ru{font-size:15px}
.wbank,.wpick{display:flex;flex-wrap:wrap;gap:8px}
.wpick{min-height:56px;border:1.5px dashed var(--sand);border-radius:12px;padding:8px;align-items:center}
.wtok{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:17px;font-weight:600;min-height:44px}
.wtok.used{opacity:.3;pointer-events:none}
.wpick .wtok{background:var(--blue-soft);border-color:transparent;color:var(--text)}
.cando{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5}
.cando li::marker{color:var(--mint-ink)}
.cando.att li::marker{color:var(--rose-ink)}
#chat-unit{min-height:46px;border:1.5px solid var(--sand);background:var(--surface);color:var(--text);border-radius:12px;padding:8px 12px;font-size:15px;max-width:100%;flex:1;min-width:0}
.ucard.locked{opacity:.55}
.exres{text-align:center;align-items:center}
.exres .big{font-family:var(--mono);font-size:52px;line-height:1.1;font-variant-numeric:tabular-nums}
.fb .ok{background:var(--mint-soft);color:var(--mint-ink);border-radius:12px;padding:10px 12px;font-size:14px}

  const u=U.find(x=>x.n===n), st=shState(n); stopAuto(); unlockTTS(); st.run=true; const tok=autoTok; if(st.i>=u.dlg.length) st.i=0;
  const step=()=>{ if(tok!==autoTok||!st.run) return;
    if(st.i>=u.dlg.length){ st.run=false; st.i=0; st.rounds++; activity(1); persist(); keepScroll(); toast(st.slow?"Медленный круг пройден. Теперь в обычном темпе.":"Круг пройден! Сделай ещё один или переходи к диалогу вслух."); return; }
    keepScroll(); focusEl(".shline.on"); const line=u.dlg[st.i][1];
    speakThen(line,st.slow,()=>{ if(tok!==autoTok||!st.run) return; const pause=Math.max(1800,plain(line).length*(st.slow?120:85)); st.pause=true; keepScroll();
      setTimeout(()=>{ if(tok!==autoTok||!st.run) return; st.pause=false; st.i++; step(); },pause); }); };
  step();
}

function drState(n){ return DR[n]||(DR[n]={role:"А",i:-1,res:{},show:{},playing:false}); }
function drFinish(n){ const u=U.find(x=>x.n===n), st=drState(n); const mine=u.dlg.map((l,i)=>i).filter(i=>u.dlg[i][0]===st.role);
  st.avg=mine.length?Math.round(mine.reduce((a,i)=>a+(st.res[i]||0),0)/mine.length):0; S.dlg[n]=Math.max(S.dlg[n]||0,st.avg); activity(2); persist(); }
function drAdvance(n){
  const u=U.find(x=>x.n===n), st=drState(n); st.i++;
  if(st.i>=u.dlg.length){ drFinish(n); keepScroll(); focusEl(".drcur"); return; }
  delete LIVE["u"+n+"d"+st.i]; keepScroll(); focusEl(".drcur");
  if(u.dlg[st.i][0]!==st.role) drPlay(n);
}
function drPlay(n){
  const u=U.find(x=>x.n===n), st=drState(n), i=st.i; stopAuto(); const tok=autoTok; st.playing=true; keepScroll();
  speakThen(u.dlg[i][1],false,()=>{ if(tok!==autoTok) return; st.playing=false; keepScroll(); setTimeout(()=>{ if(tok!==autoTok||st.i!==i) return; drAdvance(n); },800); });
}

      <div class="fcmic">${micBtn(id,1)}<span class="small muted">Скажи по-португальски</span></div>${pronUI(id)}
      <div class="row">${r?`<button class="btn" data-drnext="${n}">Продолжить разговор</button>`:`<button class="btn ghost" data-drnext="${n}" style="min-height:40px">Пропустить реплику</button>`}</div></div>`; }

    ${mine.map(i=>`<div class="ex"><div><div class="ru">${fmt(u.dlg[i][1])}</div><div class="pron small">${pron(u.dlg[i][2])}</div></div><div class="acts" style="flex-direction:row;align-items:center"><span class="pchip ${st.res[i]>=80?"ok":""}" style="margin:0">${st.res[i]!=null?st.res[i]+"%":"пропущено"}</span>${playIcon(u.dlg[i][1],1)}</div></div>`).join("")}

/* prova final */
const exWords=ru=>plain(ru).replace(/[.,!?…«»"]/g," ").split(/\s+/).filter(Boolean);
function exBuild(n){
  const u=U.find(x=>x.n===n), pool=unitChunks(n), r=rng(n*97+Date.now()%10007), sh=shuffle(pool,r); let k=0; const take=()=>sh[(k++)%sh.length];
  const mc=(c,f)=>shuffle([c.id,...shuffle(pool.filter(x=>x.id!==c.id&&x[f]!==c[f]),r).slice(0,3).map(x=>x.id)],r);
  const qs=[];
  for(let i=0;i<3;i++){ const c=take(); qs.push({t:"ouvir",id:c.id,opts:mc(c,"pt")}); }
  for(let i=0;i<2;i++){ const c=take(); qs.push({t:"escolher",id:c.id,opts:mc(c,"ru")}); }
  const pairs=[]; u.dlg.forEach((l,i)=>{ if(l[0]==="Г"&&u.dlg[i+1]&&u.dlg[i+1][0]==="А") pairs.push(i); });
  const allG=U.flatMap(x=>x.dlg.filter(l=>l[0]==="А").map(l=>l[1]));
  shuffle(pairs,r).slice(0,2).forEach(i=>{ const right=u.dlg[i+1][1]; let ds=shuffle(u.dlg.filter(l=>l[0]==="А"&&l[1]!==right).map(l=>l[1]),r).slice(0,3);
    if(ds.length<3) ds=ds.concat(shuffle(allG.filter(x=>x!==right&&!ds.includes(x)),r).slice(0,3-ds.length));
    qs.push({t:"responder",q:u.dlg[i][1],qpr:u.dlg[i][2],qpt:u.dlg[i][3],right,rpr:u.dlg[i+1][2],opts:shuffle([right,...ds],r)}); });
  while(qs.length<7){ const c=take(); qs.push({t:"ouvir",id:c.id,opts:mc(c,"pt")}); }
  shuffle(pool.filter(c=>{ const w=exWords(c.ru); return w.length>=3&&w.length<=7; }),r).slice(0,2).forEach(c=>{ const w=exWords(c.ru); let sw=shuffle(w,r), g=0; while(sw.join(" ")===w.join(" ")&&g++<10) sw=shuffle(w,r); qs.push({t:"montar",id:c.id,words:sw,pick:[]}); });
  while(qs.length<9){ const c=take(); qs.push({t:"escolher",id:c.id,opts:mc(c,"ru")}); }
  const used=new Set(); for(let i=0;i<3;i++){ let c=take(), g=0; while(used.has(c.id)&&g++<30) c=take(); used.add(c.id); qs.push({t:"falar",id:c.id}); delete LIVE[c.id]; if(openId===c.id) openId=null; }
  EX[n]={qs,i:0,score:0,end:false};
}
function exEnd(n){
  const ex=EX[n]; ex.end=true; const pct=Math.round(ex.score/ex.qs.length*100), old=S.exam[n]||{};
  S.exam[n]={best:Math.max(old.best||0,pct),last:pct,pass:!!old.pass||pct>=70,tries:(old.tries||0)+1,d:today()};
  ex.qs.filter(q=>!q.ok&&q.id&&S.cards[q.id]).forEach(q=>grade(q.id,false));
  activity(3); persist();
}
function exAnswerHTML(q){
  if(q.t==="responder") return `<span class="ru">${esc(q.right)}</span> <span class="pron small">${pron(q.rpr)}</span>`;
  const c=CH[q.id]; return `<span class="ru">${fmt(c.ru)}</span> <span class="pron small">${pron(c.pr)}</span>`;
}
function exHTML(u){
  const n=u.n, ex=EX[n], best=S.exam[n];
  if(!ex) return `<div class="card stack"><div class="eyebrow">Экзамен модуля</div><h3 class="h-display" style="font-size:26px;margin:0">12 заданий · 70% для сдачи</h3>
    <p class="small" style="margin:0">Экзамен идёт от узнавания к речи: услышать и понять, выбрать правильную фразу, ответить Габриэлю, собрать фразы и в конце сказать три фразы без подсказок. Нужно ответить верно минимум на 9 из 12, чтобы засчитать модуль и открыть следующий. В речевых заданиях считается первая попытка, и фраза принимается с оценкой от 70.</p>

      <p class="small muted" style="margin:0">${ok?"Ты показала, что владеешь материалом модуля. Фразы попадут в твою колоду и будут возвращаться в нужные дни, чтобы ты их не забыла.":"Нужно 70% (9 из 12). Повтори пункты ниже, потренируйся в Практике и попробуй снова: задания меняются с каждой попыткой."}</p>
      <div class="row" style="justify-content:center">${ok?(S.done[n]?(nx?`<button class="btn" data-unit="${nx.n}">К модулю ${pad2(nx.n)} →</button>`:`<button class="btn" data-tab="units">Модули</button>`):`<button class="btn ok" data-finish="${n}">Завершить модуль</button>`):`<button class="btn" data-exstart="${n}">Сдать ещё раз</button><button class="btn ghost" data-gostep="5">Вернуться к Практике</button>`}</div></div>
      ${wrong.length?`<h2 class="sec" style="font-size:22px">Что повторить</h2><div class="card" style="padding:4px 16px">${wrong.map(q=>`<div class="ex"><div><div class="small muted">${q.t==="responder"?"Ответ на: "+esc(plain(q.q)):q.t==="falar"?"Речь"+(q.s!=null?" (твоя оценка: "+q.s+")":""):"Задание: "+({ouvir:"на слух",escolher:"лексика",montar:"собрать фразу"}[q.t])}</div>${exAnswerHTML(q)}${q.id?`<div class="small muted">${esc(CH[q.id].pt)}</div>`:""}</div><div class="acts">${playIcon(q.t==="responder"?q.right:CH[q.id].ru,1)}</div></div>`).join("")}</div>`:""}`; }
  const q=ex.qs[ex.i], c=q.id?CH[q.id]:null, total=ex.qs.length;
  let body="";
  const opt=(val,label,isRight)=>{ let cl=""; if(q.done){ if(isRight) cl="right"; else if(String(q.pick)===String(val)) cl="wrong"; } return `<button class="opt ${cl}" data-exa="${n}" data-o="${esc(val)}" ${q.done?"disabled":""}>${label}</button>`; };
  if(q.t==="ouvir") body=`<p class="small muted" style="margin:0">Послушай и выбери, что это значит.</p><div class="row" style="margin:10px 0 4px"><button class="btn" data-say="${esc(c.ru)}">${PLAY} Слушать</button><button class="btn ghost" data-say="${esc(c.ru)}" data-slow="1">Медленно</button></div>${q.opts.map(o=>opt(o,esc(CH[o].pt),o===q.id)).join("")}`;
  else if(q.t==="escolher") body=`<p class="small muted" style="margin:0">Как это сказать по-португальски?</p><div class="ptq" style="font-family:var(--display);font-size:24px;margin:6px 0">${esc(c.pt)}</div>${q.opts.map(o=>opt(o,`<span class="ru">${fmt(CH[o].ru)}</span>`,o===q.id)).join("")}`;
  else if(q.t==="responder") body=`<p class="small muted" style="margin:0">Габриэль говорит:</p><div class="row" style="flex-wrap:nowrap;margin:6px 0"><div style="flex:1;min-width:0"><div class="ru" style="font-size:19px">${fmt(q.q)}</div>${q.done?`<div class="small muted">${esc(q.qpt)}</div>`:""}</div>${playIcon(q.q)}</div><p class="small muted" style="margin:0">Какой ответ лучше?</p>${q.opts.map((o,i)=>opt(i,`<span class="ru">${fmt(o)}</span>`,o===q.right)).join("")}`;
  else if(q.t==="montar") body=`<p class="small muted" style="margin:0">Собери фразу по-португальски:</p><div class="ptq" style="font-family:var(--display);font-size:24px;margin:6px 0">${esc(c.pt)}</div>
    <div class="wpick">${q.pick.map((wi,pi)=>`<button class="wtok" data-exun="${n}" data-p="${pi}" ${q.done?"disabled":""}>${esc(q.words[wi])}</button>`).join("")||`<span class="small muted">Нажимай на слова в правильном порядке</span>`}</div>
    <div class="wbank" style="margin-top:10px">${q.words.map((w,wi)=>`<button class="wtok ${q.pick.includes(wi)?"used":""}" data-exw="${n}" data-w="${wi}" ${q.done?"disabled":""}>${esc(w)}</button>`).join("")}</div>

function vRes(){
  const cur=resLvl||levelNow(); const L=RES.find(r=>r.lvl===cur)||RES[0];
  return freeHTML()+chatSecHTML()+`<div class="eyebrow" style="margin-top:48px">Для занятий вне курса</div><h1 class="h-display" style="font-size:32px;margin:4px 0 6px">Чтение, фильмы и музыка</h1>
  <p class="muted" style="margin-top:0">По уровням. Твой текущий уровень показан первым, остальные это карта на будущее.</p>
  <div class="seg" role="group" aria-label="Уровень" style="margin:8px 0 6px">${RES.map(r=>`<button data-res="${r.lvl}" aria-pressed="${r.lvl===cur}">${r.lvl}${r.lvl===levelNow()?" ·":""}</button>`).join("")}</div>
  <div class="row" style="margin:10px 0 4px"><h2 class="h-display" style="font-size:24px">${esc(L.lvl)} · ${esc(L.t)}</h2><span class="chip ${L.lvl===levelNow()?"ipe":""}">${L.lvl===levelNow()?"Твой уровень сейчас":esc(L.now)}</span></div>
  <div class="stack" style="margin-top:12px">${L.groups.map(([g,items])=>`<div class="card"><div class="gtitle">${GICON[g]||""}${esc(g)}</div><div class="res">${items.map(([t,x])=>`<div class="ritem"><b>${esc(t)}</b><span class="small muted">${esc(x)}</span></div>`).join("")}</div></div>`).join("")}</div>
  <h2 class="sec">Как пользоваться</h2>
  <div class="card small stack"><div>Выбирай то, что понимаешь хотя бы частично: понятный материал даёт больше, чем слишком сложный.</div><div>Смотри сначала с русскими субтитрами, потом с португальскими, а в конце без субтитров.</div><div>Выписывай 3 фразы из каждой серии и тренируй их в Свободной тренировке.</div></div>
  `;
}

/* ---------- Progresso ---------- */
const SOUNDS=[["Носовые (ão, ã, em, im)",/ã|õ|[aeiou][mn]\b/],["R и RR",/rr|\br/],["T и D перед «и»",/t[ei]\b|ti|d[ei]\b|di/],["LH и NH",/lh|nh/],["Конечная L",/l\b/],["Открытые É и Ó",/é|ó/]];
function vProg(){
  const ci=corrItems().concat(autoItems()), pr=[ci.filter(i=>i.ok).length, ci.filter(i=>!i.ok).length];
  const pct=t=>{const n=t[0]+t[1];return n?Math.round(t[0]/n*100):null;};
  const pts=doneCount()*100+S.st.c[0]*5+S.st.q[0]*10+pr[0]*15+(S.days||[]).length*20;
  const skill=(n,t,h)=>{const v=pct(t);return `<div class="skill"><div class="row" style="justify-content:space-between"><b>${n}</b><span class="small muted">${v==null?"пока нет данных":v+"% · верно "+t[0]+", тренировать "+t[1]}</span></div><div class="bar"><i style="width:${v||0}%;background:${v==null?"var(--line)":v>=80?"var(--ok)":v>=60?"var(--cobalt)":"var(--ruby)"}"></i></div><span class="tiny muted">${h}</span></div>`;};
  const snd=SOUNDS.map(([n,re])=>{ const t=[0,0]; ci.forEach(i=>{ if(re.test(plain(String(i.ru||"")).toLowerCase())) t[i.ok?0:1]++; }); return [n,t]; });
  const days=[]; for(let i=13;i>=0;i--){ const d=addDays(today(),-i); days.push([d,(S.act||{})[d]||0]); } const mx=Math.max(5,...days.map(x=>x[1]));
  const todo=[]; const dn=due().length, nu=nextUnit();
  if(dn) todo.push(`<div class="todo"><span>Повтори <b>${dn} ${plural(dn,"карточку","карточки","карточек")}</b> на сегодня. Это лучше всего закрепляет слова.</span><button class="btn" data-tab="cards">Повторить</button></div>`);
  const weak=snd.filter(([n,t])=>t[0]+t[1]>=2 && pct(t)<70).sort((a,b)=>pct(a[1])-pct(b[1]))[0];
  if(weak) todo.push(`<div class="todo"><span>Звук <b>${esc(weak[0])}</b> получается в ${pct(weak[1])}% случаев. Потренируй его во вкладке Звуки и сделай шэдоуинг.</span><button class="btn ghost" data-tab="sounds">Открыть Звуки</button></div>`);
  const lastKo=ci.filter(i=>!i.ok&&!i.auto).slice(-3);
  if(lastKo.length) todo.push(`<div class="todo"><span>Повтори фразы, которые учительница отметила для тренировки: ${lastKo.map(i=>`<span class="ru">${fmt(i.ru||"")}</span>`).join(", ")}.</span></div>`);
  const fsx=freeStats(); if(fsx&&fsx.weak.length) todo.push(`<div class="todo"><span>В Свободной тренировке повтори: ${fsx.weak.map(id=>`<span class="ru">${fmt(CH[id].ru)}</span> (${S.pron[id].s}%)`).join(", ")}.</span><button class="btn ghost" data-tab="res">Свободная тренировка</button></div>`);
  if(nu) todo.push(`<div class="todo"><span>Переходи к <b>модулю ${pad2(nu.n)}: ${esc(nu.pt)}</b>.</span><button class="btn ghost" data-unit="${nu.n}">Открыть</button></div>`);
  return `<div class="eyebrow">Твои результаты</div><h1 class="h-display" style="font-size:32px;margin:4px 0 12px">Прогресс</h1>
  <section class="hero">${ORN}<div class="eyebrow">Уровень ${levelNow()}</div><h1>${pts.toLocaleString("ru-RU")} ${plural(pts,"очко","очка","очков")}</h1><p>${doneCount()} из ${U.length} модулей · ${Object.keys(S.cards).length} фраз в колоде · ${streak()} ${plural(streak(),"день","дня","дней")} подряд</p></section>
  <h2 class="sec">Что делать сейчас</h2><div class="card stack">${todo.join('<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">')||'<span class="small muted">Всё сделано.</span>'}</div>
  ${(()=>{ const fs=freeStats(); return `<h2 class="sec">Свободная тренировка</h2><div class="card">${fs?`<div class="row" style="justify-content:space-between"><b>${fs.tr} ${plural(fs.tr,"фраза","фразы","фраз")}</b><span class="small muted">в среднем ${fs.avg}% · принято ${fs.ok}</span></div><div class="bar" style="margin-top:8px"><i style="width:${fs.avg}%;background:${fs.avg>=80?"var(--ok)":fs.avg>=60?"var(--cobalt)":"var(--ruby)"}"></i></div>`:`<span class="small muted">Ты ещё не тренировала свои фразы.</span>`}<div class="row" style="margin-top:12px"><button class="btn ghost" data-tab="res">Открыть тренировку</button></div></div>`; })()}
  <h2 class="sec">Навыки</h2><div class="card" style="padding:8px 18px">
   ${skill("Произношение",pr,"Фразы, проверенные микрофоном курса.")}
   ${skill("Память",S.st.c,"Карточки, которые ты вспомнила при повторении.")}
   ${skill("Слух",S.st.q,"Тесты на слух в конце каждого модуля.")}
   ${skill("Экзамены",[Object.values(S.exam).filter(e=>e.pass).length,Object.values(S.exam).filter(e=>!e.pass).length],"Модули, сданные на 70% и выше.")}</div>
  <h2 class="sec">Произношение по звукам</h2><div class="card" style="padding:6px 18px">${snd.map(([n,t])=>`<div class="srow"><span>${esc(n)}</span><span class="muted small">${pct(t)==null?"нет данных":pct(t)+"% ("+t[0]+"/"+(t[0]+t[1])+")"}</span></div>`).join("")}</div>
  ${corrPanel(4)}
  <h2 class="sec">Последние 14 дней</h2><div class="card"><span class="small muted">Упражнений в день</span><div class="days">${days.map(([d,n])=>`<div class="dcol" title="${dshort(d)}: ${n}"><span>${n||""}</span><i class="${n?"":"z"}" style="height:${Math.round(n/mx*100)}%"></i><span>${parse(d).getDate()}</span></div>`).join("")}</div></div>
  <h2 class="sec">Как начисляются очки</h2><div class="card small stack"><div>Сданный модуль: 100 · День занятий: 20</div><div>Фраза с принятым произношением: 15 · Верный ответ в тесте на слух: 10 · Вспомненная карточка: 5</div></div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-unblur],[data-flip],[data-reveal]"); if(!b) return; const d=b.dataset;
  if(d.unblur!=null && b.classList.contains("blur")){ b.classList.remove("blur"); return; }
  if(d.stop){ if(recId===d.stop&&recStop) recStop(true); return; }
  if(d.cancel){ if(recId===d.cancel&&recStop) recStop(false); return; }
  if(d.mine){ playMine(d.mine); return; }
  if(d.mic){ const id=d.mic; if(/^chat/.test(id)) unlockTTS(); if(recId===id){ if(recStop) recStop(true); return; } if(!d.again&&(LIVE[id]||openId===id)){ delete LIVE[id]; openId=null; keepScroll(); return; } startMic(id); return; }
  if(d.check){ check(d.check); return; }
  if(d.say!=null){ sayOne(d.say,!!d.slow); return; }
  if(d.tab){ if(d.tab==="cards") startReview(); go(d.tab); return; }
  if(d.unit){ const n=+d.unit; if(unitLocked(n)){ toast(`Сдай экзамен модуля ${pad2(n-1)}, чтобы открыть этот модуль.`); return; } go("unit",n); return; }
  if(d.gostep!=null){ stopAuto(); S.step[curU]=+d.gostep; persist(); render(); window.scrollTo({top:0}); return; }
  if(d.step){ stopAuto(); const s=Math.max(0,Math.min(STEPS.length-1,(S.step[curU]||0)+(+d.step))); S.step[curU]=s; activity(1); persist(); render(); window.scrollTo({top:0}); return; }
  if(d.pref){ S.prefs[d.pref]=S.prefs[d.pref]?0:1; persist(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.dlg){ const u=U.find(x=>x.n==d.dlg); sayList(u.dlg.map(x=>x[1]),!!d.slow); return; }
  if(d.reveal!=null){ if(REVEAL.has(d.reveal)) REVEAL.delete(d.reveal); else REVEAL.add(d.reveal); keepScroll(); return; }
  if(d.coach){ askCoach(); return; }
  if(d.shrun){ const n=+d.shrun, st=shState(n); if(st.run){ stopAuto(); keepScroll(); } else shRun(n); return; }
  if(d.shspeed){ const st=shState(+d.shspeed); st.slow=d.v==="1"; keepScroll(); return; }
  if(d.drrole){ drState(+d.drrole).role=d.v; keepScroll(); return; }
  if(d.drstart){ const n=+d.drstart, st=drState(n); unlockTTS(); st.i=-1; st.res={}; st.show={}; st.avg=0; drAdvance(n); return; }
  if(d.drnext){ stopAuto(); drAdvance(+d.drnext); return; }
  if(d.drshow){ const st=drState(+d.drshow); st.show[st.i]=1; keepScroll(); return; }
  if(d.drreset||d.drswap){ const n=+(d.drreset||d.drswap), role=drState(n).role; stopAuto(); DR[n]={role:d.drswap?(role==="А"?"Г":"А"):role,i:-1,res:{},show:{},playing:false}; keepScroll(); focusEl(".vstep:nth-of-type(2)"); return; }
  if(d.exstart){ exBuild(+d.exstart); render(); window.scrollTo({top:0}); return; }
  if(d.exa){ const ex=EX[+d.exa], q=ex.qs[ex.i]; if(q.done) return; q.pick=d.o; q.ok=q.t==="responder"?q.opts[+d.o]===q.right:d.o===q.id; q.done=true; if(q.ok) ex.score++; if(q.t==="ouvir"||q.t==="responder") sayOne(q.t==="responder"?q.right:CH[q.id].ru,false); keepScroll(); return; }
  if(d.exw){ const q=EX[+d.exw].qs[EX[+d.exw].i]; if(q.done) return; const w=+d.w; if(!q.pick.includes(w)) q.pick.push(w); keepScroll(); return; }
  if(d.exun){ const q=EX[+d.exun].qs[EX[+d.exun].i]; if(q.done) return; q.pick.splice(+d.p,1); keepScroll(); return; }
  if(d.excheck){ const ex=EX[+d.excheck], q=ex.qs[ex.i]; q.ok=q.pick.map(i=>q.words[i]).join(" ").toLowerCase()===exWords(CH[q.id].ru).join(" ").toLowerCase(); q.done=true; if(q.ok) ex.score++; sayOne(CH[q.id].ru,false); keepScroll(); return; }
  if(d.exskip){ const ex=EX[+d.exskip], q=ex.qs[ex.i]; if(recId===q.id&&recStop) recStop(false); q.done=true; q.ok=false; keepScroll(); return; }
  if(d.exnext){ const n=+d.exnext, ex=EX[n]; ex.i++; if(ex.i>=ex.qs.length) exEnd(n); render(); window.scrollTo({top:0}); return; }
  if(d.chatfrom){ CHATU=+d.chatfrom; go("res"); focusEl("#chatsec"); return; }
  if(d.freeprep){ freePrep(); return; }
  if(d.freeload){ FREE.cur=d.freeload; delete LIVE[d.freeload]; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(d.freedel){ const id=d.freedel; S.free=(S.free||[]).filter(x=>x.id!==id); delete S.pron[id]; if(!S.cards[id]) delete CH[id]; if(FREE.cur===id) FREE.cur=null; delete LIVE[id]; persist(); keepScroll(); return; }
  if(d.freedeck){ const id=d.freedeck; if(!S.cards[id]) S.cards[id]={b:0,d:addDays(today(),1)}; persist(); toast("Фраза добавлена в колоду. Она вернётся завтра в Карточках."); keepScroll(); return; }
  if(d.chatstart){ unlockTTS(); chatAsk(+d.chatstart,"chat"); return; }
  if(d.chatretry){ chatAsk(+d.chatretry,chatState(+d.chatretry).lastMode||"chat"); return; }
  if(d.chatsend){ unlockTTS(); chatSend(+d.chatsend); return; }
  if(d.chatend){ chatAsk(+d.chatend,"feedback"); return; }
  if(d.chatreset){ delete CHAT[+d.chatreset]; keepScroll(); return; }
  if(d.copy){ const el=document.getElementById(d.copy), t=el.textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Скопировано.")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); toast("Текст выделен: скопируй его через меню устройства."); }); return; }
  if(d.qa){ const q=QZ[d.qa], it=q.qs[q.i]; if(it.pick!=null) return; it.pick=d.o; const ok=d.o===it.id; S.st.q[ok?0:1]++; if(ok) q.score++; else if(S.cards[it.id]) grade(it.id,false); activity(1); persist(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.qnext){ const q=QZ[d.qnext]; q.i++; if(q.i>=q.qs.length){ q.end=true; S.quiz[d.qnext]=Math.max(S.quiz[d.qnext]||0,q.score); persist(); } const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.qreset){ delete QZ[d.qreset]; render(); return; }
  if(d.finish){ const n=+d.finish; if(!(S.exam[n]&&S.exam[n].pass)){ toast("Сдай экзамен на 70% или выше, чтобы завершить модуль."); return; } S.done[n]=1; unitChunks(n).forEach(c=>{ if(!S.cards[c.id]) S.cards[c.id]={b:0,d:addDays(today(),1)}; }); activity(3); persist(); toast("Модуль завершён! "+unitChunks(n).length+" фраз добавлено в колоду."); render(); return; }
  if(d.flip!=null && !RV.show){ RV.show=true; render(); if(RV.mode==="pt") sayOne(CH[RV.q[RV.i]].ru,false); return; }
  if(d.grade!=null){ const ok=d.grade==="1", id=RV.q[RV.i]; delete LIVE[id]; if(openId===id) openId=null; if(recId===id&&recStop) recStop(false); grade(id,ok); S.st.c[ok?0:1]++; if(ok) RV.ok++; RV.i++; RV.show=false; activity(1); persist(); render(); if(RV.mode==="ru"&&RV.i<RV.q.length) setTimeout(()=>sayOne(CH[RV.q[RV.i]].ru,false),150); return; }
  if(d.mode){ RV.mode=d.mode; RV.show=false; render(); return; }
  if(d.res){ resLvl=d.res; render(); return; }
});
document.addEventListener("change",e=>{ if(e.target&&e.target.id==="chat-unit"){ CHATU=+e.target.value; keepScroll(); } });
document.addEventListener("input",e=>{ if(e.target&&e.target.id==="free-in") FREE.text=e.target.value; });
document.addEventListener("keydown",e=>{ const t=e.target; if(e.key==="Enter"&&t&&t.dataset&&t.dataset.dict){ e.preventDefault(); check(t.dataset.dict); } if(e.key==="Enter"&&t&&t.dataset&&t.dataset.chatin){ e.preventDefault(); unlockTTS(); chatSend(+t.dataset.chatin); } });
startReview();
render();
})();
</script>

</body></html>
